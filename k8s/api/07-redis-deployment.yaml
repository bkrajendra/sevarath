apiVersion: apps/v1
kind: Deployment
metadata:
  name: sevarath-redis
  namespace: sevarath
  labels:
    app: sevarath-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sevarath-redis
  template:
    metadata:
      labels:
        app: sevarath-redis
    spec:
      initContainers:
      - name: fix-permissions
        image: busybox:1.36
        command: ['sh', '-c', 'mkdir -p /data && chown -R 999:999 /data']
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: storage-volume
          mountPath: /data
          subPath: redis
      containers:
      - name: redis
        image: redis:7-alpine
        # AOF persistence - BullMQ queue state (automated release actions, see
        # docs/architecture.md §9.2) should survive a pod restart.
        command: ['redis-server', '--appendonly', 'yes']
        ports:
        - containerPort: 6379
          name: redis
          protocol: TCP
        volumeMounts:
        - name: storage-volume
          mountPath: /data
          subPath: redis
        resources:
          requests:
            memory: '128Mi'
            cpu: '100m'
          limits:
            memory: '384Mi'
            cpu: '300m'
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: sevarath-pvc
