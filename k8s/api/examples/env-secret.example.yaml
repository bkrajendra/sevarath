apiVersion: v1
kind: Secret
metadata:
  name: sevarath-api-env
  namespace: sevarath
type: Opaque
stringData:
  # Example only — do NOT commit real credentials here.
  # Prefer creating this Secret directly from `apps/api/.env`:
  # kubectl -n sevarath create secret generic sevarath-api-env --from-env-file=apps/api/.env
  DATABASE_URL: "postgresql://sevarath:REPLACE_ME@sevarath-postgres.sevarath.svc.cluster.local:5432/sevarath"
  REDIS_URL: "redis://sevarath-redis.sevarath.svc.cluster.local:6379"

  JWT_ACCESS_SECRET: "REPLACE_ME"
  JWT_ACCESS_TTL: "15m"
  JWT_REFRESH_SECRET: "REPLACE_ME"
  JWT_REFRESH_TTL: "30d"

  # Firebase Authentication service account - see apps/api/.env.example and
  # docs/architecture.md §9.4. FIREBASE_PRIVATE_KEY keeps its literal \n escapes;
  # the app converts them to real newlines at load time.
  FIREBASE_PROJECT_ID: "REPLACE_ME"
  FIREBASE_CLIENT_EMAIL: "REPLACE_ME"
  FIREBASE_PRIVATE_KEY: "REPLACE_ME"
