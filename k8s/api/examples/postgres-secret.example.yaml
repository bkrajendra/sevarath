apiVersion: v1
kind: Secret
metadata:
  name: sevarath-postgres-env
  namespace: sevarath
type: Opaque
stringData:
  # Example only — do NOT commit real credentials here.
  # Prefer creating this Secret with a generated password, e.g.:
  # kubectl -n sevarath create secret generic sevarath-postgres-env \
  #   --from-literal=POSTGRES_USER=sevarath \
  #   --from-literal=POSTGRES_DB=sevarath \
  #   --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 32)"
  POSTGRES_USER: "sevarath"
  POSTGRES_DB: "sevarath"
  POSTGRES_PASSWORD: "REPLACE_ME"
