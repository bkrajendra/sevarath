apiVersion: v1
kind: Secret
metadata:
  name: sevarath-martin-env
  namespace: sevarath
type: Opaque
stringData:
  # Example only — do NOT commit the real value here.
  # Reuses the same sevarath Postgres user/password as sevarath-api-env's
  # DATABASE_URL (Martin only needs SELECT access to campus_roads /
  # campus_restricted_zones - the only tables with a real PostGIS geometry
  # column, so the only ones Martin auto-discovers and serves as tiles).
  DATABASE_URL: "postgresql://sevarath:REPLACE_ME@sevarath-postgres.sevarath.svc.cluster.local:5432/sevarath"
