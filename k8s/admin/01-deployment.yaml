apiVersion: apps/v1
kind: Deployment
metadata:
  name: sevarath-admin
  namespace: sevarath
  labels:
    app: sevarath-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sevarath-admin
  template:
    metadata:
      labels:
        app: sevarath-admin
    spec:
      containers:
      - name: sevarath-admin
        # VITE_* values (Firebase web config, API base URL) are baked in at image
        # build time - see apps/admin/Dockerfile and docker-publish.yml build args.
        image: ghcr.io/bkrajendra/sevarath-admin:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
