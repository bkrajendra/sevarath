apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sevarath-ingress
  namespace: sevarath
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # The driver/rider apps hold a socket.io connection open indefinitely (locations/
    # location.gateway.ts, namespace /ws) - nginx-ingress auto-detects the Upgrade header and
    # proxies it as a WebSocket, but its default proxy-read/send-timeout (60s) would still kill
    # an otherwise-idle socket between GPS pushes. Raised to 1h so a connection only drops on
    # an actual network issue, not an idle timer.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - sevarath.rajendrakhope.com
    secretName: tls-sevarath.rajendrakhope.com
  rules:
  - host: sevarath.rajendrakhope.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: sevarath-api
            port:
              number: 3000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: sevarath-api
            port:
              number: 3000
      # Real-time gateway (apps/mobile's ApiConfig.wsUrl, locations/location.gateway.ts) -
      # without this rule, the catch-all `/` path below silently sends every WebSocket
      # connection attempt to the admin app's nginx instead of the API, so it never upgrades
      # and driver location/ride events never reach the backend (confirmed root cause of
      # "driver not reporting position" / NO_DRIVER_AVAILABLE on 2026-10-10).
      #
      # The actual HTTP/WS handshake path Socket.IO listens on is `/socket.io/` by default -
      # ALWAYS, regardless of `@WebSocketGateway({ namespace: '/ws' })`. That `namespace` option
      # is a logical channel the client selects *after* connecting, not an HTTP path, so a
      # client built against ApiConfig.wsUrl (`.../ws`) still sends its handshake requests to
      # `/socket.io/?...`, never to `/ws` itself. An earlier version of this file routed `/ws`
      # instead of `/socket.io` - a plausible-looking but wrong fix that still left every
      # connection falling through to the `/` catch-all below (confirmed via live pod logs:
      # zero WebSocket connections ever reached the API, even after that first fix was deployed).
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: sevarath-api
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sevarath-admin
            port:
              number: 80
