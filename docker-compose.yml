services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sevarath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sevarath
      POSTGRES_PASSWORD: sevarath
      POSTGRES_DB: sevarath
    ports:
      - "5433:5432"
    volumes:
      - sevarath-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sevarath"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sevarath-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - sevarath-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sevarath-postgres-data:
  sevarath-redis-data:
